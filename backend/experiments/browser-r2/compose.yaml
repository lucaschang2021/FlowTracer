name: ${R2_PROJECT_NAME:-flowtracer-r2-20260909}

x-runtime: &runtime
  image: ${R2_BROWSER_IMAGE:-flowtracer-browser-r1:r1-r2}
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,noexec,size=64m
  pids_limit: 64
  mem_limit: 256m
  cpus: 0.5
  dns: 127.0.0.1
  restart: "no"

services:
  fixture:
    <<: *runtime
    entrypoint: [python, /opt/r2/fixture_server.py]
    volumes:
      - ./fixture/fixture_server.py:/opt/r2/fixture_server.py:ro
    networks:
      r2_fixture:
        ipv4_address: 192.0.2.10
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8443),1).close()"]
      interval: 1s
      timeout: 2s
      retries: 20

  decoy:
    <<: *runtime
    entrypoint: [python, /opt/r2/decoy_server.py]
    volumes:
      - ./fixture/decoy_server.py:/opt/r2/decoy_server.py:ro
    networks:
      r2_fixture:
        ipv4_address: 192.0.2.30

  proxy:
    <<: *runtime
    entrypoint: [python, /opt/r2/egress_proxy.py]
    environment:
      R2_PROXY_EVENTS: /evidence/proxy-events.jsonl
    volumes:
      - ./proxy/egress_proxy.py:/opt/r2/egress_proxy.py:ro
      - ./evidence:/evidence
    networks:
      r2_browser:
        ipv4_address: 198.51.100.20
      r2_fixture:
        ipv4_address: 192.0.2.20
    healthcheck:
      test: [CMD, python, -c, "import os; os.kill(1,0)"]
      interval: 1s
      timeout: 2s
      retries: 20

  dns-canary:
    <<: *runtime
    entrypoint: [python, /opt/r2/dns_canary.py]
    environment:
      R2_DNS_EVENTS: /evidence/dns-events.jsonl
    volumes:
      - ./fixture/dns_canary.py:/opt/r2/dns_canary.py:ro
      - ./evidence:/evidence
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      r2_browser:
        ipv4_address: 198.51.100.40
    healthcheck:
      test: [CMD, python, -c, "import os; os.kill(1,0)"]
      interval: 1s
      timeout: 2s
      retries: 20

  host-canary:
    <<: *runtime
    entrypoint: [python, /opt/r2/host_canary.py]
    volumes:
      - ./fixture/host_canary.py:/opt/r2/host_canary.py:ro
    ports:
      - 127.0.0.1:49175:49175
    networks:
      r2_host_canary:
        ipv4_address: 203.0.113.10
    healthcheck:
      test: [CMD, python, -c, "import socket; s=socket.create_connection(('127.0.0.1',49175),1); assert s.recv(32).startswith(b'R2_HOST_CANARY')"]
      interval: 1s
      timeout: 2s
      retries: 20

  control-client:
    <<: *runtime
    entrypoint: [python, /opt/r2/control_client.py]
    volumes:
      - ./control_client.py:/opt/r2/control_client.py:ro
    extra_hosts:
      - host-canary-r2.test:host-gateway
    networks:
      r2_control_client:
        ipv4_address: 198.18.0.10

  redis:
    image: redis:7.4.11-alpine3.21
    command: [redis-server, --save, "", --appendonly, "no"]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /data:rw,nosuid,noexec,size=16m
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    dns: 127.0.0.1
    restart: "no"
    networks:
      r2_browser:
        ipv4_address: 198.51.100.30
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 20

  browser:
    <<: *runtime
    entrypoint: [python, /opt/r2/browser_probe.py]
    volumes:
      - ./browser_probe.py:/opt/r2/browser_probe.py:ro
    depends_on:
      fixture:
        condition: service_healthy
      proxy:
        condition: service_healthy
      redis:
        condition: service_healthy
      dns-canary:
        condition: service_healthy
      host-canary:
        condition: service_healthy
    dns: 198.51.100.40
    extra_hosts:
      - host-canary-r2.test:host-gateway
    networks:
      r2_browser:
        ipv4_address: 198.51.100.10

networks:
  r2_browser:
    internal: true
    ipam:
      config:
        - subnet: 198.51.100.0/24
  r2_fixture:
    internal: true
    ipam:
      config:
        - subnet: 192.0.2.0/24
  r2_host_canary:
    ipam:
      config:
        - subnet: 203.0.113.0/24
  r2_control_client:
    ipam:
      config:
        - subnet: 198.18.0.0/24
